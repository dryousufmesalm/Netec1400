<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 26px; background: #101827; color: #fff; font: 18px "Segoe UI", Arial, sans-serif; }
      h1 { margin: 0 0 24px; font-size: 28px; }
      section { margin-bottom: 34px; }
      h2 { margin: 0 0 12px; font-size: 20px; color: #cfe2ff; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
      figure { margin: 0; padding: 10px; border: 1px solid #34445f; background: #172237; border-radius: 12px; }
      figcaption { padding: 3px 4px 10px; color: #b9c8dd; font-size: 14px; }
      img { width: 100%; height: auto; display: block; background: white; border-radius: 7px; }
    </style>
  </head>
  <body>
    <h1>Money Machine Sync Wizard — source / implementation</h1>
    <section>
      <h2>Overview</h2>
      <div class="pair"><figure><figcaption>Source</figcaption><img src="source-overview.png" /></figure><figure><figcaption>Real implementation — Windows Edge / 1440×1024</figcaption><img src="../qa-real/01-real-overview-empty.png" /></figure></div>
    </section>
    <section>
      <h2>VPS details</h2>
      <div class="pair"><figure><figcaption>Source</figcaption><img src="source-form.png" /></figure><figure><figcaption>Real discovery form — Windows Edge / 1440×1024</figcaption><img src="../qa-real/02-real-form.png" /></figure></div>
    </section>
    <section>
      <h2>Readiness check</h2>
      <div class="pair"><figure><figcaption>Source</figcaption><img src="source-check.png" /></figure><figure><figcaption>Real validation state — Windows Edge / 1440×1024</figcaption><img src="../qa-real/03-real-account-error.png" /></figure></div>
    </section>
  </body>
</html>
